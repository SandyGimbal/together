<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3887FF" />
      <stop offset="50%" stop-color="#9277FF" />
      <stop offset="100%" stop-color="#FF75B8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="44" fill="#101A2C" stroke="url(#orbitGrad)" stroke-width="1.5" />
  
  <!-- Outer Orbit Ring -->
  <ellipse cx="50" cy="50" rx="36" ry="16" transform="rotate(-30 50 50)" stroke="#36D9FF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  <ellipse cx="50" cy="50" rx="36" ry="16" transform="rotate(30 50 50)" stroke="#FF75B8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  
  <!-- Central Earth / Signal Core -->
  <circle cx="50" cy="50" r="16" fill="#080B14" stroke="url(#orbitGrad)" stroke-width="2" filter="url(#glow)" />
  
  <!-- Love Heart Pin Center -->
  <path d="M50 43 C46 39 40 41 40 46 C40 52 50 58 50 58 C50 58 60 52 60 46 C60 41 54 39 50 43 Z" fill="url(#orbitGrad)" />

  <!-- Orbiting Partner Dots -->
  <circle cx="24" cy="38" r="4.5" fill="#3887FF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="76" cy="62" r="4.5" fill="#FF75B8" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>

