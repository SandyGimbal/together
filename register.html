<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daftar Akun — TOGETHER</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080B14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TOGETHER">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5.2rem 1.25rem 2.5rem;
      position: relative;
    }
    .auth-card-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-glass-panel);
      backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2.2rem;
      box-shadow: var(--shadow-lg), var(--glow-blue);
      position: relative;
      z-index: 10;
    }
    .auth-logo-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .auth-logo-img {
      width: 60px;
      height: 60px;
      margin-bottom: 0.8rem;
      filter: drop-shadow(0 0 15px rgba(56, 135, 255, 0.6));
    }
  </style>
</head>
<body>
  <!-- Auth Top Navigation Bar (Responsive Desktop & Mobile) -->
  <nav class="auth-navbar">
    <a href="index.html" class="navbar-brand">
      <img src="assets/icons/logo.svg" alt="TOGETHER" class="brand-logo-img">
      <span class="brand-name"><span class="gradient-blue-text">TO</span><span class="gradient-pink-text">GETHER</span></span>
    </a>
    <div style="display: flex; align-items: center; gap: 0.65rem;">
      <a href="index.html" class="btn-ghost" style="padding: 0.4rem 0.75rem; font-size: 0.85rem; border-radius: var(--radius-full); text-decoration: none; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 0.35rem;">
        <i data-lucide="home" style="width: 15px; height: 15px;"></i>
        <span>Beranda</span>
      </a>
      <a href="login.html" class="btn-ghost" style="padding: 0.4rem 0.75rem; font-size: 0.85rem; border-radius: var(--radius-full); text-decoration: none; color: var(--pure-white); display: inline-flex; align-items: center; gap: 0.35rem;">
        <i data-lucide="log-in" style="width: 15px; height: 15px;"></i>
        <span>Masuk</span>
      </a>
      <button type="button" class="btn-install-pwa" id="btn-install-pwa-nav" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: var(--radius-full); border: 1px solid var(--cyan-accent); color: var(--cyan-accent); background: rgba(54, 217, 255, 0.1); display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer;">
        <i data-lucide="download" style="width: 14px; height: 14px;"></i>
        <span>Pasang App</span>
      </button>
    </div>
  </nav>

  <div class="space-background"></div>
  <canvas id="starfield-canvas" class="starfield-canvas"></canvas>
  <div class="ambient-orb orb-blue"></div>
  <div class="ambient-orb orb-pink"></div>

  <div class="auth-page-container">
    <div class="auth-card-container stagger-1">
      <div class="auth-logo-center">
        <a href="index.html">
          <img src="assets/icons/logo.svg" alt="TOGETHER" class="auth-logo-img animate-glow">
        </a>
        <h1 style="font-size: 1.8rem; margin-bottom: 0.3rem;">
          <span class="gradient-blue-text">Buat</span> <span class="gradient-pink-text">Akun Baru</span>
        </h1>
        <p style="font-size: 0.88rem;">Bergabung dan mulai bagikan titik koordinat cinta Anda</p>
      </div>

      <!-- Registration Form -->
      <form id="register-form">
        <!-- Display Name -->
        <div class="form-group">
          <label class="form-label" for="reg-name">
            <i data-lucide="user" style="width: 15px; height: 15px;"></i> Nama Panggilan
          </label>
          <div class="input-wrapper">
            <span class="input-icon"><i data-lucide="smile" style="width: 17px; height: 17px;"></i></span>
            <input type="text" id="reg-name" class="form-input" placeholder="contoh: Sandy / Dhea" required autocomplete="name">
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="reg-email">
            <i data-lucide="mail" style="width: 15px; height: 15px;"></i> Alamat Email
          </label>
          <div class="input-wrapper">
            <span class="input-icon"><i data-lucide="at-sign" style="width: 17px; height: 17px;"></i></span>
            <input type="email" id="reg-email" class="form-input" placeholder="nama@email.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="reg-password">
            <i data-lucide="lock" style="width: 15px; height: 15px;"></i> Kata Sandi (min. 6 karakter)
          </label>
          <div class="input-wrapper">
            <span class="input-icon"><i data-lucide="key" style="width: 17px; height: 17px;"></i></span>
            <input type="password" id="reg-password" class="form-input" placeholder="••••••••" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <!-- Avatar Choice -->
        <div class="form-group">
          <label class="form-label">
            <i data-lucide="sparkles" style="width: 15px; height: 15px; color: var(--romantic-pink);"></i> Pilih Avatar Profil Anda
          </label>
          <div class="avatar-grid" id="avatar-selector">
            <div class="avatar-choice selected" data-avatar="assets/avatars/avatar-1.svg">
              <img src="assets/avatars/avatar-1.svg" alt="Avatar 1">
            </div>
            <div class="avatar-choice" data-avatar="assets/avatars/avatar-2.svg">
              <img src="assets/avatars/avatar-2.svg" alt="Avatar 2">
            </div>
            <div class="avatar-choice" data-avatar="assets/avatars/avatar-3.svg">
              <img src="assets/avatars/avatar-3.svg" alt="Avatar 3">
            </div>
            <div class="avatar-choice" data-avatar="assets/avatars/avatar-4.svg">
              <img src="assets/avatars/avatar-4.svg" alt="Avatar 4">
            </div>
            <div class="avatar-choice" data-avatar="assets/avatars/avatar-5.svg">
              <img src="assets/avatars/avatar-5.svg" alt="Avatar 5">
            </div>
            <div class="avatar-choice" data-avatar="assets/avatars/avatar-6.svg">
              <img src="assets/avatars/avatar-6.svg" alt="Avatar 6">
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit-register" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
          <span>Daftar dengan Email</span>
        </button>

        <div style="display: flex; align-items: center; margin: 1rem 0; color: var(--text-muted); font-size: 0.8rem; text-align: center;">
          <span style="flex:1; border-bottom: 1px solid var(--border-subtle);"></span>
          <span style="padding: 0 0.8rem;">ATAU</span>
          <span style="flex:1; border-bottom: 1px solid var(--border-subtle);"></span>
        </div>

        <button type="button" id="btn-reg-google" class="btn btn-secondary" style="width: 100%; border-color: rgba(255,255,255,0.25);">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          <span>Daftar / Masuk Cepat dengan Google</span>
        </button>
      </form>

      <!-- Login Link -->
      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Sudah memiliki akun? <a href="login.html" style="font-weight: 600; color: var(--cyan-accent);">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let selectedAvatarPath = 'assets/avatars/avatar-1.svg';

      // Avatar selection grid
      const avatarChoices = document.querySelectorAll('.avatar-choice');
      avatarChoices.forEach(choice => {
        choice.addEventListener('click', () => {
          avatarChoices.forEach(c => c.classList.remove('selected'));
          choice.classList.add('selected');
          selectedAvatarPath = choice.dataset.avatar;
        });
      });

      // Handle Google Sign-In / Register
      document.getElementById('btn-reg-google')?.addEventListener('click', async () => {
        try {
          const res = await window.authService.signInWithGoogle();
          window.notifier.showToast("Berhasil Masuk Google! 🎉", `Selamat datang, ${res.profile.displayName}!`, "success");
          setTimeout(() => {
            window.location.href = 'pairing.html';
          }, 600);
        } catch (err) {
          window.notifier.showToast("Gagal Masuk Google", err.message, "error");
        }
      });
      const regForm = document.getElementById('register-form');
      const submitBtn = document.getElementById('btn-submit-register');

      regForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const displayName = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>Mendaftarkan akun...</span>`;

        try {
          await window.authService.register({
            displayName,
            email,
            password,
            avatar: selectedAvatarPath
          });

          window.notifier.showToast("Pendaftaran Berhasil! 🎉", `Selamat datang, ${displayName}!`, "success");
          setTimeout(() => {
            window.location.href = 'pairing.html';
          }, 800);
        } catch (err) {
          window.notifier.showToast("Pendaftaran Gagal", err.message, "error");
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i data-lucide="user-plus" style="width: 18px; height: 18px;"></i><span>Daftar & Lanjutkan ke Pairing</span>`;
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
      });
    });
  </script>
</body>
</html>
